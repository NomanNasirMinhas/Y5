name: Linux terminal releases
on:
  push:
    branches: [build]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    if: github.ref == 'refs/heads/build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - name: Set release build number
        run: echo "Y5_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: bash scripts/ci/package.sh ${{ matrix.arch }}
      - uses: actions/attest@v4
        with:
          subject-path: release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: release-assets/*
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish terminal binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "terminal-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" release-assets/* \
            --target "$GITHUB_SHA" --title "Y5 terminal build ${GITHUB_RUN_NUMBER}" \
            --notes "Terminal-only Linux prerelease. Raspberry Pi uses ARM64. See README for requirements and migration details." \
            --prerelease
